<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Devilbox Boost</title>
    <link rel="stylesheet" href="/src/styles.css" />
    <script type="module" src="/src/main.ts" defer></script>
  </head>
  <body>
    <div id="app">
      <nav class="sidebar">
        <div class="brand">
          <span class="brand-dot" id="brand-dot"></span>
          <div>
            <div class="brand-name">Devilbox Boost</div>
            <div class="brand-sub" id="brand-sub">checking…</div>
          </div>
        </div>
        <button class="nav-item active" data-view="overview">Overview</button>
        <button class="nav-item" data-view="projects">Projects</button>
        <button class="nav-item" data-view="databases">Databases</button>
        <button class="nav-item" data-view="tools">Tools</button>
        <button class="nav-item" data-view="ssh">SSH</button>
        <div class="nav-group">Sites</div>
        <button class="nav-item" data-view="doctor">Doctor</button>
        <button class="nav-item" data-view="updates">Updates</button>
        <button class="nav-item" data-view="create">New project</button>
        <button class="nav-item" data-view="files">Files</button>
        <button class="nav-item" data-view="intranet">Intranet</button>
        <div class="spacer"></div>
        <button class="nav-item" data-view="help">Help</button>
        <button class="nav-item" data-view="settings">Settings</button>
        <a class="credit" data-open="https://moducraft.io" title="Open moducraft.io">Created by <strong>moducraft.io</strong></a>
      </nav>
      <main class="content">
        <section id="view-overview" class="view active"></section>
        <section id="view-projects" class="view"></section>
        <section id="view-project" class="view"></section>
        <section id="view-doctor" class="view"></section>
        <section id="view-databases" class="view"></section>
        <section id="view-tools" class="view"></section>
        <section id="view-ssh" class="view"></section>
        <section id="view-updates" class="view"></section>
        <section id="view-create" class="view"></section>
        <section id="view-files" class="view"></section>
        <section id="view-settings" class="view"></section>
        <section id="view-help" class="view"></section>
        <section id="view-intranet" class="view"></section>
        <section id="view-frame" class="view frame-view">
          <div class="frame-bar"><button class="back" id="frame-back">← Intranet</button><span id="frame-title" class="muted"></span><span class="spacer"></span><button class="btn small" id="frame-window">Open in window</button><button class="btn small" id="frame-browser">Browser</button></div>
          <iframe id="intranet-frame" title="Devilbox intranet"></iframe>
        </section>
      </main>
    </div>
    <div id="toast" class="toast" hidden></div>
  </body>
</html>
