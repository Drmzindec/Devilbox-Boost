name: Companion release

# Builds the companion app for Linux and attaches the packages to the GitHub
# release for the tag:
#   Devilbox.Boost_<version>_amd64.deb
#   Devilbox.Boost-<version>-1.x86_64.rpm
#   Devilbox.Boost_<version>_amd64.AppImage
# Runs on v* tags, or by hand for an existing tag (e.g. to add Linux builds to
# a release that only has the macOS dmg).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build and upload to (e.g. v1.0.8)"
        required: true

permissions:
  contents: write

jobs:
  linux:
    # 22.04 keeps the glibc floor low so the AppImage runs on older distros
    runs-on: ubuntu-22.04
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libssl-dev libxdo-dev \
            patchelf file

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: companion/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: companion/src-tauri

      - name: Install frontend dependencies
        working-directory: companion
        run: npm ci

      # tauri.conf.json only lists the macOS bundle targets, so pass the
      # Linux ones explicitly
      - name: Build and upload
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: companion
          tagName: ${{ env.TAG }}
          releaseName: ${{ env.TAG }}
          releaseDraft: false
          args: --bundles deb,rpm,appimage
